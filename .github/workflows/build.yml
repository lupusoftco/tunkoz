name: Build & Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      shell: pwsh
      run: |
        $out = dotnet test --no-build --configuration Release 2>&1
        $code = $LASTEXITCODE
        $out | Write-Output
        if ($code -ne 0) {
          # Surface failures as annotations so they're visible without downloading logs
          $out | Select-String -Pattern '^\s*(Failed |Error Message:|Assert\.|Expected|Actual|.*Exception)' -Context 0,2 |
            Select-Object -First 40 | ForEach-Object {
              $msg = ($_.Line + ' ' + ($_.Context.PostContext -join ' ')).Trim() -replace '[\r\n]', ' '
              Write-Output "::error::$msg"
            }
          exit $code
        }

    - name: Publish self-contained executable
      run: dotnet publish src/Tunkoz/Tunkoz.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tunkoz-win-x64
        path: publish/Tunkoz.exe
        retention-days: 30

    - name: Create release archive
      run: |
        cd publish
        7z a Tunkoz-win-x64.zip Tunkoz.exe
        cd ..

    - name: Upload release archive
      uses: actions/upload-artifact@v4
      with:
        name: Tunkoz-release
        path: publish/Tunkoz-win-x64.zip
        retention-days: 30
